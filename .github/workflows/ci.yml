name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run RAG tests
        run: python -m pytest -q tests/test_rag_*.py tests/test_rag_stage12.py
      - name: Run citation smoke test
        run: python scripts/smoke_test_rag_citation.py